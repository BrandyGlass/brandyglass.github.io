<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重賞消去法ラボ</title>
  <style>
    :root{
      --bg:#0b1220;
      --panel:#121a2b;
      --line:#2a3754;
      --text:#e8eefc;
      --muted:#9fb0d1;
      --accent:#67e8f9;
      --accent2:#60a5fa;
      --shadow:0 10px 30px rgba(0,0,0,.28);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      padding:20px;
      background:linear-gradient(180deg,#08101d 0%, #0b1220 100%);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
    }
    .wrap{max-width:900px;margin:0 auto}
    .hero{
      background:linear-gradient(135deg, rgba(96,165,250,.18), rgba(103,232,249,.08));
      border:1px solid var(--line);
      border-radius:24px;
      padding:22px;
      box-shadow:var(--shadow);
      margin-bottom:18px;
    }
    h1{
      margin:0 0 8px;
      font-size:30px;
      line-height:1.2;
    }
    .sub{
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
    }
    .list{
      display:grid;
      gap:14px;
    }
    .card{
      display:block;
      text-decoration:none;
      color:inherit;
      background:rgba(18,26,43,.92);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:var(--shadow);
      transition:transform .15s ease, border-color .15s ease;
    }
    .card:active{
      transform:scale(.99);
    }
    .title{
      font-size:20px;
      font-weight:800;
      margin-bottom:8px;
    }
    .desc{
      color:var(--muted);
      font-size:14px;
      line-height:1.6;
    }
    .badge{
      display:inline-block;
      margin-top:10px;
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:var(--text);
    }
    .footer{
      margin-top:16px;
      color:var(--muted);
      font-size:12px;
      line-height:1.6;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>重賞消去法ラボ</h1>
      <div class="sub">
        強めの消し条件だけで機械的に削る重賞サイト集です。<br>
        各ページは、重賞ごとに固定ルールを当てはめて候補を絞る構成です。
      </div>
    </section>

    <section class="list">
      <a class="card" href="https://brandyglass.github.io/oji-osakahai-/">
        <div class="title">大阪杯 2026</div>
        <div class="desc">
          阪神芝2000m。強めの消し4条件だけで機械的に絞り込むページ。
        </div>
        <div class="badge">公開ページ</div>
      </a>

      <a class="card" href="https://brandyglass.github.io/oji-derbykyoct/">
        <div class="title">ダービー卿チャレンジトロフィー 2026</div>
        <div class="desc">
          中山マイル重賞向けの消去法ページ。
        </div>
        <div class="badge">公開ページ</div>
      </a>

      <a class="card" href="https://brandyglass.github.io/oji-chaachirudaunzu/">
        <div class="title">チャーチルダウンズカップ 2026</div>
        <div class="desc">
          今年の登録馬に消去条件を当てはめて候補を削るページ。
        </div>
        <div class="badge">公開ページ</div>
      </a>
    </section>

    <div class="footer">
      ※ リンク先は GitHub Pages で公開されている各重賞ページです。
    </div>
  </div>
</body>
</html>
